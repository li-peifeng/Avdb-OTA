name: Sync release to Gitee (manual fallback)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub Release tag to sync as a manual fallback
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: sync-gitee-release-${{ inputs.tag || github.run_id }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      GITEE_REPOSITORY: avdb/ota

    steps:
      - name: Resolve release tag
        shell: bash
        env:
          DISPATCH_TAG: ${{ inputs.tag || '' }}
        run: |
          set -Eeuo pipefail
          tag="$DISPATCH_TAG"
          [[ "$tag" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "Invalid release tag: $tag" >&2
            exit 1
          }
          echo "AVDB_OTA_RELEASE_TAG=$tag" >> "$GITHUB_ENV"

      - name: Validate Gitee token
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ -n "$GITEE_TOKEN" ]] || {
            echo 'Repository secret GITEE_TOKEN is required.' >&2
            exit 1
          }

      - name: Download GitHub release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          asset_dir="$RUNNER_TEMP/avdb-ota-assets"
          mkdir -p "$asset_dir"
          gh release download "$AVDB_OTA_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern 'manifest.json' \
            --pattern 'avdb-*.pkg.enc' \
            --dir "$asset_dir"
          [[ -f "$asset_dir/manifest.json" ]] || {
            echo 'GitHub Release is missing manifest.json.' >&2
            exit 1
          }
          package_count="$(find "$asset_dir" -maxdepth 1 -type f -name 'avdb-*.pkg.enc' | wc -l | tr -d ' ')"
          [[ "$package_count" == '1' ]] || {
            echo "Expected exactly one encrypted OTA package, found $package_count." >&2
            exit 1
          }
          gh release view "$AVDB_OTA_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json body --jq '.body // ""' > "$asset_dir/release-body.md"
          echo "AVDB_OTA_ASSET_DIR=$asset_dir" >> "$GITHUB_ENV"

      - name: Create or update the Gitee release
        shell: bash
        run: |
          set -Eeuo pipefail
          api_root="https://gitee.com/api/v5/repos/$GITEE_REPOSITORY"
          encoded_tag="$(python3 -c 'from urllib.parse import quote; import sys; print(quote(sys.argv[1], safe=""))' "$AVDB_OTA_RELEASE_TAG")"
          release_json="$RUNNER_TEMP/gitee-release.json"
          release_status="$(curl -sS --retry 3 --retry-delay 1 \
            -H "Authorization: Bearer $GITEE_TOKEN" \
            -H 'Accept: application/json' \
            -o "$release_json" -w '%{http_code}' \
            "$api_root/releases/tags/$encoded_tag" || true)"

          release_missing=0
          if [[ "$release_status" == '404' ]]; then
            release_missing=1
          elif [[ "$release_status" == '200' ]] \
            && jq -e 'type == "null"' "$release_json" >/dev/null; then
            # Gitee returns HTTP 200 with a JSON null body when the tag has no
            # Release, instead of returning HTTP 404 like GitHub does.
            release_missing=1
          fi

          if [[ "$release_missing" == '1' ]]; then
            body_file="$RUNNER_TEMP/gitee-release-payload.json"
            python3 - "$body_file" "$AVDB_OTA_RELEASE_TAG" "$AVDB_OTA_ASSET_DIR/release-body.md" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload_path = Path(sys.argv[1])
          tag = sys.argv[2]
          body = Path(sys.argv[3]).read_text(encoding="utf-8")
          payload_path.write_text(
              json.dumps(
                  {
                      "tag_name": tag,
                      "name": f"Avdb OTA {tag}",
                      "target_commitish": "master",
                      "body": body,
                      "prerelease": False,
                  },
                  ensure_ascii=False,
              ),
              encoding="utf-8",
          )
          PY
            curl --fail-with-body --retry 3 --retry-delay 1 \
              -H "Authorization: Bearer $GITEE_TOKEN" \
              -H 'Accept: application/json' \
              -H 'Content-Type: application/json' \
              -X POST "$api_root/releases" \
              --data-binary "@$body_file" > "$release_json"
          elif [[ "$release_status" != '200' ]]; then
            echo "Unable to read Gitee release for tag $AVDB_OTA_RELEASE_TAG (HTTP $release_status)." >&2
            cat "$release_json" >&2
            exit 1
          fi

          release_id="$(jq -er '.id | numbers' "$release_json")"
          echo "AVDB_GITEE_RELEASE_ID=$release_id" >> "$GITHUB_ENV"

      - name: Replace Gitee release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          api_root="https://gitee.com/api/v5/repos/$GITEE_REPOSITORY"
          assets_json="$RUNNER_TEMP/gitee-assets.json"
          status="$(curl -sS --retry 3 --retry-delay 1 \
            -H "Authorization: Bearer $GITEE_TOKEN" \
            -H 'Accept: application/json' \
            -o "$assets_json" -w '%{http_code}' \
            "$api_root/releases/$AVDB_GITEE_RELEASE_ID/attach_files" || true)"
          [[ "$status" == '200' ]] || {
            echo "Unable to list Gitee release assets (HTTP $status)." >&2
            cat "$assets_json" >&2
            exit 1
          }

          for asset_path in "$AVDB_OTA_ASSET_DIR/manifest.json" "$AVDB_OTA_ASSET_DIR"/avdb-*.pkg.enc; do
            asset_name="$(basename "$asset_path")"
            existing_id="$(jq -r --arg name "$asset_name" \
              '.[] | select((.name // "") == $name) | .id' "$assets_json" | head -n 1)"
            if [[ "$existing_id" =~ ^[0-9]+$ ]]; then
              curl --fail-with-body --retry 3 --retry-delay 1 \
                -H "Authorization: Bearer $GITEE_TOKEN" \
                -X DELETE \
                "$api_root/releases/$AVDB_GITEE_RELEASE_ID/attach_files/$existing_id"
            fi
            curl --fail-with-body --retry 3 --retry-delay 1 \
              -H "Authorization: Bearer $GITEE_TOKEN" \
              -F "file=@$asset_path;filename=$asset_name" \
              "$api_root/releases/$AVDB_GITEE_RELEASE_ID/attach_files"
          done

      - name: Verify Gitee release assets
        shell: bash
        run: |
          set -Eeuo pipefail
          api_root="https://gitee.com/api/v5/repos/$GITEE_REPOSITORY"
          assets_json="$RUNNER_TEMP/gitee-assets-final.json"
          curl --fail-with-body --retry 3 --retry-delay 1 \
            -H "Authorization: Bearer $GITEE_TOKEN" \
            -H 'Accept: application/json' \
            "$api_root/releases/$AVDB_GITEE_RELEASE_ID/attach_files" > "$assets_json"
          for asset_path in "$AVDB_OTA_ASSET_DIR/manifest.json" "$AVDB_OTA_ASSET_DIR"/avdb-*.pkg.enc; do
            asset_name="$(basename "$asset_path")"
            jq -e --arg name "$asset_name" \
              'any(.[]; (.name // "") == $name)' "$assets_json" >/dev/null || {
              echo "Gitee release is missing asset: $asset_name" >&2
              exit 1
            }
          done
          echo "Gitee release synced: https://gitee.com/$GITEE_REPOSITORY/releases/tag/$AVDB_OTA_RELEASE_TAG"
